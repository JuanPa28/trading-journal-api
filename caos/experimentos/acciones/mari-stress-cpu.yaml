# Chaos Mesh: satura la CPU de UN pod de la API de Mari durante 3 minutos y se detiene solo.
# Ajusta NAMESPACE y APP_LABEL a como esta desplegada la API (los reemplaza mari-inyectar.sh).
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: mari-cpu-stress
  namespace: ${NAMESPACE}
spec:
  mode: one
  selector:
    namespaces:
      - ${NAMESPACE}
    labelSelectors:
      app: ${APP_LABEL}
  stressors:
    cpu:
      workers: 2
      load: 100
  duration: "3m"
