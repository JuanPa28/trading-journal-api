spring:
  application:
    name: trading-journal-api
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [traceId=%X{traceId}] [%15.15t] %-40.40logger{39} : %m%n"

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      # Histograma completo (no percentiles calculados del lado del cliente):
      # con 2-4 réplicas por el HPA, un p95 calculado dentro de un solo pod
      # no se puede promediar entre pods sin quedar matemáticamente mal. El
      # histograma sí se puede agregar entre pods; p50/p95 real se obtienen
      # en Grafana/PromQL con histogram_quantile(0.95, sum(rate(
      # http_server_requests_seconds_bucket[5m])) by (le)).
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  # Sin endpoint OTLP configurado, no intenta conectarse a nada — las trazas
  # se ven en los logs (exportador "logging") mientras el grupo define la
  # herramienta SAAS transversal. Apuntar OTEL_EXPORTER_OTLP_ENDPOINT una vez
  # esté decidido, sin tocar código.
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}

companions:
  mari:
    base-url: ${MARI_BASE_URL:http://34.57.56.128}
  pipe:
    base-url: ${PIPE_BASE_URL:http://k8s-default-ecommerc-233fe225e6-944515052.us-east-2.elb.amazonaws.com}

# Credenciales de la llave API de OCI — las mismas que usa el resto del
# proyecto, nunca con valores quemados: siempre vienen de variables de
# entorno (ver k8s/README.md para cómo se cargan como Secret en el clúster).
oci:
  tenancy-id: ${OCI_TENANCY_ID}
  user-id: ${OCI_USER_ID}
  fingerprint: ${OCI_FINGERPRINT}
  private-key: ${OCI_PRIVATE_KEY}
  region: ${OCI_REGION:sa-bogota-1}
  object-storage:
    namespace: ${OCI_OBJECT_STORAGE_NAMESPACE:axxhzvxjrmcl}
    bucket: ${OCI_OBJECT_STORAGE_BUCKET:trading-journal-attachments}
