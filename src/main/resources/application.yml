spring:
  application:
    name: trading-journal-api
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [traceId=%X{traceId}] [%15.15t] %-40.40logger{39} : %m%n"

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    # Toda métrica lleva la versión y el track que la produjo, para comparar
    # canary contra stable en el tablero sin depender de la plataforma.
    tags:
      version: ${APP_VERSION:dev}
      track: ${APP_TRACK:stable}
    distribution:
      # Histograma completo (no percentiles calculados del lado del cliente):
      # con 2-4 réplicas por el HPA, un p95 calculado dentro de un solo pod
      # no se puede promediar entre pods sin quedar matemáticamente mal. El
      # histograma sí se puede agregar entre pods; p50/p95 real se obtienen
      # en Grafana/PromQL con histogram_quantile(0.95, sum(rate(
      # http_server_requests_seconds_bucket[5m])) by (le)).
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  # Conexión a Grafana Cloud (OTLP) — trazas por management.opentelemetry.*
  # (la ruta correcta, no deprecada, de Spring Boot 4.1; management.otlp.tracing.*
  # quedó deprecada "a error" y además, se confirmó, nunca manda el header de
  # autenticación, así que Grafana respondía 401 aunque la credencial fuera
  # correcta). A propósito NO se le pone un valor por defecto vacío aquí: la
  # ruta nueva SÍ intenta construir el exportador igual con "" y el pod
  # crashea ("Invalid endpoint, must start with http:// or https://",
  # confirmado en un pod real) — a diferencia de la ruta vieja, que se queda
  # inerte sola. Por eso el endpoint solo se setea si el Secret de Kubernetes
  # trae la variable MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
  # (binding automático de Spring, sin mapeo manual aquí) — si no está
  # presente en el entorno, la propiedad queda genuinamente ausente (no
  # vacía) y TracingConfig usa el exportador a logs en su lugar.
  otlp:
    metrics:
      export:
        # A diferencia de tracing.endpoint, el registro de métricas OTLP NO se
        # queda inerte solo — intenta publicar cada 30s aunque la URL esté
        # vacía, lo que genera un stack trace "URI is not absolute" en cada
        # intento (confirmado corriendo la app). Por eso lleva su propio
        # "enabled", apagado por defecto — se prende junto con la URL cuando
        # el grupo tenga las credenciales de Grafana Cloud.
        enabled: ${OTEL_EXPORTER_OTLP_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:}
        headers:
          Authorization: ${GRAFANA_OTLP_AUTH_HEADER:}
        step: 30s
        resource-attributes:
          service.name: ${OTEL_SERVICE_NAME:trading-journal-api}

companions:
  mari:
    base-url: ${MARI_BASE_URL:http://34.57.56.128}
  pipe:
    base-url: ${PIPE_BASE_URL:http://k8s-default-ecommerc-233fe225e6-1328693903.us-east-2.elb.amazonaws.com}

# Credenciales de la llave API de OCI — las mismas que usa el resto del
# proyecto, nunca con valores quemados: siempre vienen de variables de
# entorno (ver k8s/README.md para cómo se cargan como Secret en el clúster).
oci:
  tenancy-id: ${OCI_TENANCY_ID}
  user-id: ${OCI_USER_ID}
  fingerprint: ${OCI_FINGERPRINT}
  private-key: ${OCI_PRIVATE_KEY}
  region: ${OCI_REGION:sa-bogota-1}
  object-storage:
    namespace: ${OCI_OBJECT_STORAGE_NAMESPACE:axxhzvxjrmcl}
    bucket: ${OCI_OBJECT_STORAGE_BUCKET:trading-journal-attachments}

# Identidad de la instancia para el Canary Deployment. Los inyecta el despliegue
# (la misma imagen se promueve de canary a stable sin reconstruirse).
app:
  version: ${APP_VERSION:dev}
  track: ${APP_TRACK:stable}
