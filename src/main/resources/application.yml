spring:
  application:
    name: trading-journal-api
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [traceId=%X{traceId}] [%15.15t] %-40.40logger{39} : %m%n"

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

companions:
  mari:
    base-url: ${MARI_BASE_URL:http://34.57.56.128}
  pipe:
    base-url: ${PIPE_BASE_URL:http://alb-ecommerce-1653098310.us-east-2.elb.amazonaws.com}
