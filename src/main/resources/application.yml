spring:
  application:
    name: trading-journal-api
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [traceId=%X{traceId}] [%15.15t] %-40.40logger{39} : %m%n"

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      # Histograma completo (no percentiles calculados del lado del cliente):
      # con 2-4 réplicas por el HPA, un p95 calculado dentro de un solo pod
      # no se puede promediar entre pods sin quedar matemáticamente mal. El
      # histograma sí se puede agregar entre pods; p50/p95 real se obtienen
      # en Grafana/PromQL con histogram_quantile(0.95, sum(rate(
      # http_server_requests_seconds_bucket[5m])) by (le)).
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  # Conexión a Grafana Cloud (OTLP) — EN PAUSA a pedido de Pipe (grupo, 2026-09-23),
  # todavía no listo de su lado. No tocar / no activar hasta que él avise.
  #
  # Nota técnica encontrada al intentarlo: la ruta "nueva" y no-deprecada
  # (management.opentelemetry.tracing.export.otlp.*) NO se queda inerte con el
  # endpoint vacío como sí hace esta de abajo — Spring intenta construir el
  # exportador igual y el pod crashea con "Invalid endpoint, must start with
  # http:// or https://" (confirmado en un pod real). Por eso, mientras no haya
  # endpoint real, esta app se queda en la ruta management.otlp.tracing.* — sí
  # deprecada, pero comprobada segura en vacío — con el trade-off de que sus
  # headers no se aplican (para eso sirve el bean manual de más abajo). Cuando
  # el grupo esté listo, cambiar a la ruta nueva Y setear el endpoint al mismo
  # tiempo en el mismo despliegue, nunca una sin la otra.
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:}
    metrics:
      export:
        # A diferencia de tracing.endpoint, el registro de métricas OTLP NO se
        # queda inerte solo — intenta publicar cada 30s aunque la URL esté
        # vacía, lo que genera un stack trace "URI is not absolute" en cada
        # intento (confirmado corriendo la app). Por eso lleva su propio
        # "enabled", apagado por defecto — se prende junto con la URL cuando
        # el grupo tenga las credenciales de Grafana Cloud.
        enabled: ${OTEL_EXPORTER_OTLP_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:}
        headers:
          Authorization: ${GRAFANA_OTLP_AUTH_HEADER:}
        step: 30s
        resource-attributes:
          service.name: ${OTEL_SERVICE_NAME:trading-journal-api}

companions:
  mari:
    base-url: ${MARI_BASE_URL:http://34.57.56.128}
  pipe:
    base-url: ${PIPE_BASE_URL:http://k8s-default-ecommerc-233fe225e6-1328693903.us-east-2.elb.amazonaws.com}

# Credenciales de la llave API de OCI — las mismas que usa el resto del
# proyecto, nunca con valores quemados: siempre vienen de variables de
# entorno (ver k8s/README.md para cómo se cargan como Secret en el clúster).
oci:
  tenancy-id: ${OCI_TENANCY_ID}
  user-id: ${OCI_USER_ID}
  fingerprint: ${OCI_FINGERPRINT}
  private-key: ${OCI_PRIVATE_KEY}
  region: ${OCI_REGION:sa-bogota-1}
  object-storage:
    namespace: ${OCI_OBJECT_STORAGE_NAMESPACE:axxhzvxjrmcl}
    bucket: ${OCI_OBJECT_STORAGE_BUCKET:trading-journal-attachments}
