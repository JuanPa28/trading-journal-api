<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Flujo multinube con puntos de inyección, radio de impacto y mediciones</text>

  <!-- Frontera del radio de impacto -->
  <rect x="226" y="44" width="760" height="404" rx="16" fill="none" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="8,5"/>
  <text x="238" y="62" font-size="11" font-weight="700" fill="#b91c1c">FRONTERA DEL RADIO DE IMPACTO: solo infraestructura del grupo y datos sintéticos</text>

  <!-- Cliente k6 -->
  <rect x="14" y="170" width="170" height="110" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.6"/>
  <text x="99" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">k6</text>
  <text x="99" y="216" text-anchor="middle" font-size="11" fill="#374151">perfil fijo: 5, 15 y 30 usuarios</text>
  <text x="99" y="233" text-anchor="middle" font-size="11" fill="#374151">genera el X-Trace-Id</text>
  <text x="99" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">M1: p95 y éxito del flujo</text>
  <line x1="184" y1="225" x2="270" y2="225" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- Coordinador -->
  <rect x="270" y="110" width="270" height="230" rx="12" fill="#e3ecfd" stroke="#1d4ed8" stroke-width="2"/>
  <text x="405" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">AZURE · Juanpa (coordinador)</text>
  <text x="405" y="158" text-anchor="middle" font-size="12" fill="#1d4ed8">GET /api/v2/trades/{id}</text>
  <text x="405" y="178" text-anchor="middle" font-size="11" fill="#1d4ed8">Container Apps · base Oracle</text>
  <text x="405" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">F1 · latencia saliente (cabecera)</text>
  <text x="405" y="224" text-anchor="middle" font-size="10.5" fill="#b91c1c">X-Inject-Outbound-Latency-Ms</text>
  <text x="405" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Patrones: timeout · circuit breaker</text>
  <text x="405" y="266" text-anchor="middle" font-size="10.5" fill="#15803d">apagados en la ronda 0</text>
  <text x="405" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">M2: línea de acceso (ms, status)</text>
  <text x="405" y="312" text-anchor="middle" font-size="10.5" fill="#7c3aed">Log Analytics · tablero</text>

  <!-- Mari -->
  <rect x="680" y="76" width="296" height="130" rx="12" fill="#e0f4e8" stroke="#15803d" stroke-width="2"/>
  <text x="828" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">GOOGLE CLOUD · Mari (GKE)</text>
  <text x="828" y="120" text-anchor="middle" font-size="11.5" fill="#15803d">/api/v1/partidos · /predicciones</text>
  <text x="828" y="142" text-anchor="middle" font-size="10.5" fill="#15803d">2+ réplicas · probes · requests y limits</text>
  <text x="828" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">F3 · agotamiento de CPU (Chaos Mesh)</text>
  <text x="828" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">M2/M3: Cloud Logging · Cloud Monitoring</text>

  <!-- Pipe -->
  <rect x="680" y="250" width="296" height="130" rx="12" fill="#fdf0dc" stroke="#b45309" stroke-width="2"/>
  <text x="828" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">AWS · Pipe</text>
  <text x="828" y="294" text-anchor="middle" font-size="11.5" fill="#b45309">/api/v1/commerce · /products</text>
  <text x="828" y="316" text-anchor="middle" font-size="10.5" fill="#b45309">balanceador · instancias</text>
  <text x="828" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">F2 · indisponibilidad de una instancia</text>
  <text x="828" y="364" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">M2/M3: CloudWatch Logs y métricas</text>

  <line x1="540" y1="190" x2="680" y2="148" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="540" y1="262" x2="680" y2="310" stroke="#374151" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="600" y="156" font-size="10.5" fill="#374151">X-Trace-Id</text>
  <text x="600" y="296" font-size="10.5" fill="#374151">X-Trace-Id</text>

  <!-- Chaos Toolkit -->
  <rect x="270" y="372" width="270" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="405" y="396" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">Chaos Toolkit · experimentos como código</text>
  <text x="405" y="416" text-anchor="middle" font-size="10.5" fill="#5b21b6">estado estable · hipótesis · método · reversión</text>
  <line x1="405" y1="372" x2="405" y2="340" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>

  <!-- Leyenda -->
  <rect x="14" y="462" width="972" height="84" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="5,3"/>
  <text x="30" y="484" font-size="12" font-weight="700" fill="#111827">Dónde se mide cada métrica</text>
  <text x="30" y="504" font-size="11" fill="#374151"><tspan font-weight="700" fill="#7c3aed">M1</tspan> métrica objetivo, de extremo a extremo: k6 (--summary-export) y caos/gate/evaluar.py.</text>
  <text x="30" y="522" font-size="11" fill="#374151"><tspan font-weight="700" fill="#7c3aed">M2</tspan> métricas de cada API: línea de acceso del log (status y ms) en el servicio de logs de cada nube.</text>
  <text x="30" y="540" font-size="11" fill="#374151"><tspan font-weight="700" fill="#7c3aed">M3</tspan> plataforma: CPU, memoria y reinicios, en el monitoreo nativo de cada nube.     <tspan font-weight="700" fill="#b91c1c">F1, F2, F3</tspan> puntos de inyección de fallos.</text>
</svg>
