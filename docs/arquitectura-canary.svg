<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151"/>
    </marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Entrega 4 — Canary Deployment sobre Google Cloud Run</text>

  <!-- GitHub Actions -->
  <rect x="30" y="50" width="300" height="150" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="1.6"/>
  <text x="180" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">GitHub Actions · canary-rollout.yml</text>
  <text x="45" y="100" font-size="12" fill="#374151">1. Pruebas de la puerta de calidad</text>
  <text x="45" y="120" font-size="12" fill="#374151">2. Construye stable (v3.1.0) y canary (v4.0.0)</text>
  <text x="45" y="140" font-size="12" fill="#374151">3. Despliega las dos revisiones (0 % al canary)</text>
  <text x="45" y="160" font-size="12" fill="#374151">4. Mueve el tráfico y mide cada etapa con carga</text>
  <text x="45" y="180" font-size="12" fill="#b91c1c" font-weight="700">5. Si se viola un umbral: rollback a 100 % stable</text>

  <!-- Artifact Registry -->
  <rect x="400" y="50" width="250" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="525" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Artifact Registry</text>
  <text x="525" y="98" text-anchor="middle" font-size="11" fill="#1e3a8a">imágenes inmutables, fijadas por @sha256</text>
  <line x1="330" y1="85" x2="400" y2="85" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Usuarios -->
  <rect x="720" y="50" width="250" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="845" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Clientes (Postman, carga)</text>
  <text x="845" y="98" text-anchor="middle" font-size="11" fill="#78350f">una sola URL pública del servicio</text>

  <!-- Cloud Run -->
  <rect x="330" y="160" width="640" height="250" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="650" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">GOOGLE CLOUD RUN · servicio «api» · reparto de tráfico por revisión</text>

  <rect x="355" y="205" width="270" height="110" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.8"/>
  <text x="490" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Revisión STABLE · v3.1.0</text>
  <text x="490" y="250" text-anchor="middle" font-size="11" fill="#14532d">X-App-Track: stable · api/v1</text>
  <text x="490" y="268" text-anchor="middle" font-size="11" fill="#14532d">línea base (baseline)</text>
  <text x="490" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">100 % → 90 % → 50 % → 0 %</text>

  <rect x="690" y="205" width="260" height="110" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
  <text x="820" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Revisión CANARY · v4.0.0</text>
  <text x="820" y="250" text-anchor="middle" font-size="11" fill="#78350f">X-App-Track: canary · api/v3</text>
  <text x="820" y="268" text-anchor="middle" font-size="11" fill="#78350f">setupScore y setupGrade (campo nuevo)</text>
  <text x="820" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">0 % → 10 % → 50 % → 100 %</text>

  <text x="490" y="345" text-anchor="middle" font-size="11" fill="#14532d">etapa 0: 0 % público, solo por la URL de la revisión (tag)</text>
  <text x="820" y="345" text-anchor="middle" font-size="11" fill="#78350f">falla simulada con la cabecera X-Inject-Fault</text>

  <line x1="845" y1="120" x2="845" y2="160" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="650" y1="120" x2="520" y2="205" stroke="#374151" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <line x1="650" y1="120" x2="790" y2="205" stroke="#374151" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="560" y="150" font-size="10.5" fill="#374151">despliega</text>

  <!-- Rollback -->
  <path d="M 690 375 C 640 395, 600 395, 560 375" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#r)"/>
  <text x="625" y="404" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">rollback inmediato</text>

  <!-- Oracle -->
  <rect x="30" y="250" width="270" height="130" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="165" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">ORACLE CLOUD (Bogotá)</text>
  <rect x="48" y="292" width="234" height="70" rx="8" fill="#ffffff" stroke="#c2410c"/>
  <text x="165" y="315" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c2d12">Autonomous Database (Always Free)</text>
  <text x="165" y="334" text-anchor="middle" font-size="10.5" fill="#7c2d12">compartida por stable y canary</text>
  <text x="165" y="350" text-anchor="middle" font-size="10.5" fill="#7c2d12">Expand/Contract: columna setup_score nullable</text>
  <line x1="355" y1="285" x2="300" y2="320" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="690" y1="300" x2="635" y2="300" stroke="none"/>
  <text x="330" y="322" text-anchor="middle" font-size="10" fill="#374151">JDBC</text>

  <!-- Observabilidad -->
  <rect x="30" y="440" width="940" height="130" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="500" y="466" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Observabilidad y decisión</text>
  <rect x="50" y="480" width="280" height="70" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text x="190" y="503" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Cloud Monitoring · tablero</text>
  <text x="190" y="522" text-anchor="middle" font-size="10.5" fill="#5b21b6">tráfico, 5xx, p50/p95/p99, CPU y memoria</text>
  <text x="190" y="538" text-anchor="middle" font-size="10.5" fill="#5b21b6">stable vs canary, lado a lado</text>
  <rect x="360" y="480" width="280" height="70" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text x="500" y="503" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Puerta de calidad (gate.py)</text>
  <text x="500" y="522" text-anchor="middle" font-size="10.5" fill="#5b21b6">umbrales en slo.json: PROMOTE · HOLD · ABORT</text>
  <text x="500" y="538" text-anchor="middle" font-size="10.5" fill="#5b21b6">mide con carga concurrente y muestra mínima</text>
  <rect x="670" y="480" width="280" height="70" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text x="810" y="503" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Alerta de errores 5xx del canary</text>
  <text x="810" y="522" text-anchor="middle" font-size="10.5" fill="#5b21b6">más de 0,5 errores/s en una revisión canary</text>
  <text x="810" y="538" text-anchor="middle" font-size="10.5" fill="#5b21b6">aviso por correo</text>
  <line x1="650" y1="410" x2="500" y2="480" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
</svg>
