<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Entrega 3 — Infraestructura como código con Terraform</text>

  <!-- Desarrollador / GitHub -->
  <rect x="330" y="50" width="340" height="70" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.6"/>
  <text x="500" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">GitHub Actions — terraform-deploy.yml</text>
  <text x="500" y="96" text-anchor="middle" font-size="11.5" fill="#374151">Run workflow: apply  ·  destroy</text>
  <text x="500" y="112" text-anchor="middle" font-size="11" fill="#6b7280">valida → construye la imagen → terraform apply → comprueba el API</text>

  <!-- Terraform -->
  <rect x="380" y="160" width="240" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="500" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Terraform (carpeta terraform/)</text>
  <text x="500" y="203" text-anchor="middle" font-size="11" fill="#5b21b6">un .tf por servicio · estado remoto en OCI</text>
  <line x1="500" y1="120" x2="500" y2="160" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Azure -->
  <rect x="30" y="270" width="440" height="300" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">AZURE (eastus) — cómputo</text>
  <rect x="55" y="312" width="390" height="48" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="250" y="333" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Resource Group</text>
  <text x="250" y="350" text-anchor="middle" font-size="10.5" fill="#1e3a8a">resource_group.tf · contiene todo lo de Azure</text>
  <rect x="55" y="372" width="390" height="82" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="250" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Container Instances — el API</text>
  <text x="250" y="413" text-anchor="middle" font-size="10.5" fill="#1e3a8a">api.tf · imagen Docker de GHCR · Spring Boot en el puerto 8080</text>
  <text x="250" y="430" text-anchor="middle" font-size="10.5" fill="#1e3a8a">probes de salud · variables de entorno cableadas por Terraform</text>
  <text x="250" y="446" text-anchor="middle" font-size="10.5" fill="#6b7280">URL pública: http://…azurecontainer.io:8080</text>
  <rect x="55" y="466" width="390" height="48" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="250" y="487" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Log Analytics</text>
  <text x="250" y="504" text-anchor="middle" font-size="10.5" fill="#1e3a8a">log_analytics.tf · logs del contenedor</text>

  <!-- OCI -->
  <rect x="530" y="270" width="440" height="300" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="750" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">ORACLE CLOUD (sa-bogota-1) — datos</text>
  <rect x="555" y="312" width="390" height="52" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/>
  <text x="750" y="334" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c2d12">Autonomous Database (Always Free)</text>
  <text x="750" y="352" text-anchor="middle" font-size="10.5" fill="#7c2d12">database.tf · Trader, Trade y Strategy · TLS sin wallet</text>
  <rect x="555" y="374" width="390" height="48" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/>
  <text x="750" y="395" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c2d12">Object Storage</text>
  <text x="750" y="412" text-anchor="middle" font-size="10.5" fill="#7c2d12">storage.tf · bucket privado de adjuntos</text>
  <rect x="555" y="432" width="390" height="48" rx="8" fill="#ffffff" stroke="#c2410c"/>
  <text x="750" y="453" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c2d12">Notifications  →  correo</text>
  <text x="750" y="470" text-anchor="middle" font-size="10.5" fill="#7c2d12">notifications.tf · tópico + suscripción</text>
  <rect x="555" y="490" width="390" height="48" rx="8" fill="#ffffff" stroke="#c2410c"/>
  <text x="750" y="511" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c2d12">Monitoring — alarma de CPU</text>
  <text x="750" y="528" text-anchor="middle" font-size="10.5" fill="#7c2d12">alarm.tf · avisa por el tópico si la CPU de la BD &gt; 80 %</text>

  <!-- Flechas Terraform -> nubes -->
  <line x1="420" y1="216" x2="300" y2="270" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="580" y1="216" x2="700" y2="270" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="330" y="236" font-size="10.5" fill="#5b21b6">provider azurerm</text>
  <text x="640" y="236" font-size="10.5" fill="#5b21b6">provider oci</text>

  <!-- API -> datos -->
  <line x1="445" y1="410" x2="555" y2="343" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="445" y1="420" x2="555" y2="398" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="500" y="388" text-anchor="middle" font-size="10" fill="#374151">JDBC</text>
  <text x="500" y="434" text-anchor="middle" font-size="10" fill="#374151">SDK de OCI</text>

  <!-- Estado -->
  <rect x="330" y="582" width="340" height="30" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="5,3"/>
  <text x="500" y="602" text-anchor="middle" font-size="11" fill="#4b5563">Estado de Terraform: bucket de OCI (backend.tf) — no se destruye</text>
</svg>
