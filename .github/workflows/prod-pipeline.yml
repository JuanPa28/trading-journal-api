name: Pipeline - Producción

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    name: Build, test, coverage gate, deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, run tests and check coverage gate (85%)
        run: mvn -B clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-prod
          path: target/site/jacoco

      - name: Compute image name
        id: vars
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "ocir_image=bog.ocir.io/axxhzvxjrmcl/trading-journal-api" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: bog.ocir.io
          username: axxhzvxjrmcl/Default/${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Build and push Docker image (Producción)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.vars.outputs.image }}:prod-${{ github.sha }}
            ${{ steps.vars.outputs.image }}:prod-latest
            ${{ steps.vars.outputs.ocir_image }}:prod-${{ github.sha }}
            ${{ steps.vars.outputs.ocir_image }}:latest

      - name: Deploy to OKE
        id: deploy
        continue-on-error: true
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OKE_CLUSTER_ID: ${{ secrets.OKE_CLUSTER_ID }}
        run: |
          pip install --quiet oci-cli
          mkdir -p ~/.oci
          echo "$OCI_CLI_KEY_CONTENT" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=sa-bogota-1
          key_file=$HOME/.oci/key.pem
          EOF
          oci ce cluster create-kubeconfig --cluster-id "$OKE_CLUSTER_ID" --file ~/.kube/config --region sa-bogota-1 --token-version 2.0.0 --kube-endpoint PUBLIC_ENDPOINT
          kubectl set image deployment/trading-journal-api trading-journal-api=${{ steps.vars.outputs.ocir_image }}:prod-${{ github.sha }}
          kubectl rollout status deployment/trading-journal-api --timeout=60s

      - name: Deploy status (OKE)
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "✅ Desplegado al clúster OKE."
          else
            echo "⚠️ No se pudo confirmar el despliegue al clúster OKE (sin nodos disponibles — problema de capacidad ya documentado). La imagen sí quedó publicada en OCIR."
          fi

      # El cómputo real de esta entrega corre en AKS (Azure) — OCI se quedó sin
      # capacidad ARM gratis para los nodos de OKE, así que movimos el clúster
      # a Azure manteniendo la base de datos y el Object Storage en OCI, donde
      # ya estaban funcionando. Ver k8s/README.md para la explicación completa.
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_AKS_CLUSTER }}

      - name: Deploy to AKS
        id: deploy_aks
        run: |
          kubectl set image deployment/trading-journal-api trading-journal-api=${{ steps.vars.outputs.ocir_image }}:prod-${{ github.sha }}
          kubectl rollout status deployment/trading-journal-api --timeout=180s

      - name: Deploy status (AKS)
        if: always()
        run: |
          if [ "${{ steps.deploy_aks.outcome }}" = "success" ]; then
            echo "✅ Desplegado al clúster AKS."
          else
            echo "❌ Falló el despliegue a AKS — revisar el log del paso anterior."
          fi
