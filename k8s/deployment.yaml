apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-journal-api
  labels:
    app: trading-journal-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trading-journal-api
  template:
    metadata:
      labels:
        app: trading-journal-api
    spec:
      imagePullSecrets:
        - name: ocir-credentials
      containers:
        - name: trading-journal-api
          image: bog.ocir.io/axxhzvxjrmcl/trading-journal-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: trading-journal-config
            - secretRef:
                name: trading-journal-db-credentials
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
